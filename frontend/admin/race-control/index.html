<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safety Control Panel</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Safety Control Panel</h1>
  <p>Use this interface to control flags and ensure safety during races.</p>
  <div>
    <button class="start" onclick="startRace()">Start Race</button>
    <button class="stop" onclick="stopRace()">Stop Race</button>
    <button class="hazard" onclick="reportHazard()">Report Hazard</button>
    <button class="reset" onclick="resetRace()">Reset Race</button>
  </div>
  <div id="keyModal">
    <div>
      <h2>Enter Receptionist Key</h2>
      <input type="password" id="raceControlKeyInput">
      <button id="submitKeyBtn" class="add">Enter</button>
      <div id="keyError">Invalid key. Try again.</div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>

  <script src="index.js"></script>
</body>
</html>
